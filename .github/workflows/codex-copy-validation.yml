name: Validate SliceDataset copy protocol
on:
  push:
    branches: [codex/validate-1169-copy-protocol]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - numpy: '1.26.4'
            sklearn: '1.7.2'
            scipy: '1.16.3'
          - numpy: '2.5.4'
            sklearn: '1.9.1'
            scipy: '1.18.1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install CPU dependencies
        run: |
          python -m pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install '.[test]' numpy==${{ matrix.numpy }} scikit-learn==${{ matrix.sklearn }} scipy==${{ matrix.scipy }} pandas==2.3.3 safetensors==0.8.0
          python -m pip list
      - name: Unchanged upstream CPU suite
        run: |
          git worktree add --detach "$RUNNER_TEMP/skorch-base" 195afc0361a2b3aaf2ec0a4504a2a6ea8ef29cbb
          cd "$RUNNER_TEMP/skorch-base"
          export PYTHONPATH="$PWD"
          python -c 'import skorch; print(skorch.__file__)'
          python -m pytest -q --no-cov --ignore=skorch/tests/test_hf.py --ignore=skorch/tests/llm -k 'not distributed and not test_fit_and_predict_with_compile and not test_binary_classifier_with_compile' --tb=short | tee "$RUNNER_TEMP/baseline.log"
      - name: Fixed CPU suite
        run: |
          export PYTHONPATH="$PWD"
          python -c 'import skorch; print(skorch.__file__)'
          python -m pytest -q --no-cov --ignore=skorch/tests/test_hf.py --ignore=skorch/tests/llm -k 'not distributed and not test_fit_and_predict_with_compile and not test_binary_classifier_with_compile' --tb=short | tee "$RUNNER_TEMP/fixed.log"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: numpy-${{ matrix.numpy }}-logs
          path: |
            ${{ runner.temp }}/baseline.log
            ${{ runner.temp }}/fixed.log
